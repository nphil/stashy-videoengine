name: Build FFmpeg XCFrameworks

on:
  push:
    branches: [main]
    # Only what changes or checks the binaries; Swift work runs in
    # swift-tests.yml without rebuilding FFmpeg.
    paths:
      - 'scripts/build-ffmpeg.sh'
      - 'scripts/build-deps.sh'
      - 'scripts/verify.sh'
      - 'scripts/sim-udid.sh'
      - 'test/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release (e.g. v1.0.0). Leave empty to only build + verify.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    env:
      FFMPEG_VERSION: n8.1.3
      MIN_IOS_VERSION: "16.0"
      USE_CCACHE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iphoneos SDK:        $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "runner image:        ${ImageOS:-?} ${ImageVersion:-?}"
          bash --version | head -1

      # configure probes `xcrun -sdk macosx metal -v` and silently disables
      # Metal, and with it yadif_videotoolbox, when that fails. Xcode 26 and
      # later ship the Metal toolchain as a separate component.
      - name: Install the Metal toolchain
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v

      - name: Install build tools (autotools / meson for external libs)
        run: |
          brew install --quiet autoconf automake libtool pkgconf meson ninja xz \
            || brew install autoconf automake libtool pkgconf meson ninja xz

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-sdk${{ env.IOS_SDK }}

      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-src-${{ env.FFMPEG_VERSION }}

      - name: Cache external libraries (fribidi/freetype/harfbuzz/zimg/libass/dav1d)
        uses: actions/cache@v4
        with:
          path: build/deps
          # The SDK is part of the key so a new Xcode rebuilds the libraries
          # instead of reusing ones compiled against the previous SDK.
          key: deps-sdk${{ env.IOS_SDK }}-${{ env.MIN_IOS_VERSION }}-${{ hashFiles('scripts/build-deps.sh') }}
          # Save even when a later step (FFmpeg configure/build) fails, so
          # iterating on FFmpeg flags doesn't re-pay the ~10m dep cross-compile.
          save-always: true

      - name: Build XCFrameworks
        run: bash scripts/build-ffmpeg.sh

      - name: Verify
        run: bash scripts/verify.sh

      - name: Swift package against the fresh XCFrameworks
        run: bash scripts/swift-test.sh --local

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcframeworks
          path: |
            build/dist/*.xcframework.zip
            build/dist/checksums.txt
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh "${{ inputs.release_tag }}"
